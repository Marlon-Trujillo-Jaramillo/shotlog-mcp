name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv run --group dev pytest -q

  build:
    name: Package builds and the server answers MCP introspection (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - run: docker build -t shotlog-mcp .
      - name: MCP handshake + tools/list over stdio
        run: python3 .github/scripts/mcp_smoke.py 6 docker run -i --rm shotlog-mcp
